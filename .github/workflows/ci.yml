name: CI

on: [push, pull_request]

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalog
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_products
      - run: ruff check config shop manage.py
      - run: pytest
      - run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: example.com
          SECRET_KEY: ci-production-secret-key-32chars-minimum-ok
