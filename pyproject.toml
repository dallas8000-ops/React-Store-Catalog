[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"shop/migrations/*" = ["E501", "I001"]
"config/settings/production.py" = ["F405"]
"config/settings/base.py" = ["E501"]
"shop/forms.py" = ["E501"]
"shop/urls.py" = ["E501"]
"shop/views.py" = ["E501"]
"shop/management/commands/seed_products.py" = ["E501"]
